# The Flip has no GPU, so no shaders: this list carries its two display filters through the same
# Shader/Filter menu (plorpos-f1p.75). diatom's Flip port reads the pass names (flipfx-scanlines,
# flipfx-grid) and draws them with the blitter; there are no .glsl files. They apply at 2x or more.
#
#   name | passes | final
Grid      | flipfx-grid:nearest:1      | nearest
Scanlines | flipfx-scanlines:nearest:1 | nearest
