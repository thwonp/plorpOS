# Streams start at full volume, unmuted, every time (plorpos-3yv.39). The
# launcher owns the level - the output's, and Diatom's own - so nothing here
# wants a stream's volume or mute remembered. And remembering does harm: they
# are kept per media role, and native PICO-8 and Diatom are both "game", so
# PICO-8 left muted (child_quiet, while Muse plays) gave the next session's
# Diatom stream that mute for the whole session - every game silent.
wireplumber.settings = {
  node.stream.restore-props = false
}
