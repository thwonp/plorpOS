# An output WirePlumber has no stored volume for - a DAC or headset never seen
# before - starts at 10% on the slider (0.1 cubed), not its 0.064 = 40%: IEMs on
# a USB DAC at a loud first level is hearing damage (plorpos-3yv.68). The
# launcher re-syncs every new output at its stored level (platform_rotate.c,
# sink_resync), so this is the level that sticks.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.001
}
