# sway for plorpOS on the RG Rotate (plorpos-3yv). A kiosk: one fullscreen
# window at a time (platform_rotate.c screen_yield), no bars, no cursor.
# Xwayland for X11 ports (plorpos-3yv.86): sway starts it on the first X
# client and it quits 10 s after the last one, so it costs nothing otherwise.
xwayland enable
output * bg #000000 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
# Every window fullscreen, whatever it asks for: two clients up at once (the
# launcher and a standalone Diatom) were tiled side by side (2026-10-17).
for_window [app_id=".*"] fullscreen enable
# X11 windows have a class, not an app_id (plorpos-3yv.86.3).
for_window [class=".*"] fullscreen enable
# Ren'Py (PortMaster's runtime draws in software) keeps the surface of its
# first window size; a resize leaves every later frame unseen. It floats at
# its own size, centred (plorpos-3yv.86.10). After the rules above: later
# rules run later.
for_window [app_id="startRENPY"] fullscreen disable, floating enable, move position center
seat * hide_cursor 1
# plorpOS reads its keys from evdev itself. Not "input type:keyboard events
# disabled": the touch panel and the hall switch share their libinput
# devices with key capabilities, and that turns the whole device off. sway
# binds no keys, and the launcher and Diatom ignore SDL's key events.
# Touch lands in the output's coordinates, so it follows the rotation below.
input type:touch map_to_output DSI-1
# The swivel (SW_LID, 1 = closed): closed puts the panel's top on the
# viewer's left, so the picture turns with it (plorpos-3yv.9).
bindswitch --reload --locked lid:on output DSI-1 transform 90
bindswitch --reload --locked lid:off output DSI-1 transform normal
exec /bin/sh /mnt/SDCARD/plorpOS/rotate/launch.sh
