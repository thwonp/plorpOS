# sway for plorpOS on the RG Rotate (plorpos-3yv). A kiosk: one fullscreen
# window at a time (platform_rotate.c screen_yield), no bars, no cursor.
xwayland disable
output * bg #000000 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 1
# plorpOS reads its keys from evdev itself; sway passing them on as well
# would hand the volume keys to whichever window has focus.
input type:keyboard events disabled
# Touch lands in the output's coordinates, so it follows the rotation below.
input type:touch map_to_output DSI-1
# The swivel (SW_LID, 1 = closed): closed puts the panel's top on the
# viewer's left, so the picture turns with it (plorpos-3yv.9).
bindswitch --reload --locked lid:on output DSI-1 transform 90
bindswitch --reload --locked lid:off output DSI-1 transform normal
exec /bin/sh /mnt/SDCARD/TortOS/rotate/launch.sh
